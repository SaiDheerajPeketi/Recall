name: recall

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: recall
      POSTGRES_USER: recall
      POSTGRES_PASSWORD: recall-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recall -d recall"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  qdrant:
    image: qdrant/qdrant:v1.15.4
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"

  bootstrap:
    build:
      context: ./backend
      target: runtime
    command: ["python", "-m", "app.bootstrap"]
    environment: &api-environment
      DATABASE_URL: postgresql+asyncpg://recall:recall-local@postgres:5432/recall
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: recall_support
      CORPUS_PATH: /app/data/corpus.jsonl
      GENERATION_PROVIDER: ${GENERATION_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash-lite}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - ./data:/app/data:ro
    restart: "no"

  api:
    build:
      context: ./backend
      target: runtime
    environment: *api-environment
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "8000:8000"

  web:
    build:
      context: ./frontend
      target: runtime
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:80"

  ollama:
    image: ollama/ollama:0.11.10
    profiles: ["ollama"]
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"

  evaluator:
    build:
      context: ./backend
      target: runtime
    profiles: ["tools"]
    environment: *api-environment
    command: ["python", "-m", "app.evaluation"]
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    volumes:
      - ./data:/app/data:ro
      - ./evaluation:/app/evaluation

volumes:
  postgres_data:
  qdrant_data:
  ollama_data:

